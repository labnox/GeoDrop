<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#06b6d4" stroke-width="6" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Outer Soundwaves -->
  <path d="M 330 190 A 90 90 0 0 1 330 322" fill="none" stroke="url(#pulse-grad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 365 160 A 135 135 0 0 1 365 352" fill="none" stroke="url(#accent-grad)" stroke-width="14" stroke-linecap="round" opacity="0.8"/>

  <!-- Pin Center / Ear Icon -->
  <g transform="translate(180, 160)">
    <!-- Stylized Ear / Pin -->
    <path d="M 50 15 C 10 15, -15 45, -15 90 C -15 135, 10 160, 35 175 C 55 187, 65 198, 65 215 C 65 220, 75 220, 75 215 C 75 190, 60 175, 45 165 C 25 152, 5 130, 5 90 C 5 55, 25 35, 50 35 C 75 35, 95 55, 95 85 C 95 105, 80 120, 65 120 C 55 120, 50 112, 50 102 C 50 92, 58 85, 68 85" 
          fill="none" 
          stroke="url(#accent-grad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
    
    <!-- Sound dot / Core Beacon -->
    <circle cx="68" cy="85" r="10" fill="#10b981" filter="url(#glow)"/>
  </g>
</svg>
